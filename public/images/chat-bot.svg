<svg viewBox="0 0 80 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Head gradient -->
    <radialGradient id="hg" cx="40%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <!-- Body gradient -->
    <radialGradient id="bg" cx="40%" cy="25%" r="75%">
      <stop offset="0%"   stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </radialGradient>
    <!-- Glow filter for accent elements -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft shadow under body -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1736" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ════ WHOLE ROBOT — gentle float up/down ════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-4; 0,0" dur="2.8s"
      repeatCount="indefinite" calcMode="linear"/>

    <!-- ── Antenna stem ── -->
    <line x1="40" y1="17" x2="40" y2="7"
          stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

    <!-- Antenna tip — color + size pulse -->
    <circle cx="40" cy="5.5" r="3.5" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="r"
        values="3.5;5;3.5" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="fill"
        values="#60a5fa;#bfdbfe;#93c5fd;#60a5fa" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- ── Head ── -->
    <rect x="16" y="17" width="48" height="44" rx="12" fill="url(#hg)" filter="url(#shadow)"/>
    <!-- Head rim -->
    <rect x="16" y="17" width="48" height="44" rx="12"
          fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Face screen (dark inset) -->
    <rect x="22" y="23" width="36" height="28" rx="7"
          fill="#0b1736" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.9"/>

    <!-- ── Eyes (blink via ry: full → 0.4 → full) ── -->
    <!-- Left eye -->
    <ellipse cx="33" cy="34" rx="5.5" ry="5.5" fill="#60a5fa" filter="url(#glow)">
      <animate attributeName="ry"
        values="5.5;5.5;0.4;5.5;5.5;5.5" dur="4s"
        keyTimes="0;0.35;0.4;0.45;0.8;1" repeatCount="indefinite"/>
    </ellipse>
    <!-- Left eye shine -->
    <ellipse cx="35" cy="32" rx="1.6" ry="1.6" fill="white" opacity="0.8"/>

    <!-- Right eye -->
    <ellipse cx="47" cy="34" rx="5.5" ry="5.5" fill="#60a5fa" filter="url(#glow)">
      <animate attributeName="ry"
        values="5.5;5.5;0.4;5.5;5.5;5.5" dur="4s" begin="0.06s"
        keyTimes="0;0.35;0.4;0.45;0.8;1" repeatCount="indefinite"/>
    </ellipse>
    <!-- Right eye shine -->
    <ellipse cx="49" cy="32" rx="1.6" ry="1.6" fill="white" opacity="0.8"/>

    <!-- ── Smile ── -->
    <path d="M29 44 Q40 51 51 44"
          stroke="#93c5fd" stroke-width="2.2" fill="none" stroke-linecap="round">
      <animate attributeName="d"
        values="M29 44 Q40 51 51 44; M29 44 Q40 53 51 44; M29 44 Q40 51 51 44"
        dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- ── Side ears ── -->
    <rect x="8"  y="28" width="8" height="14" rx="4"
          fill="#1e40af" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="64" y="28" width="8" height="14" rx="4"
          fill="#1e40af" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5"/>

    <!-- ── Body ── -->
    <rect x="20" y="61" width="40" height="30" rx="10" fill="url(#bg)" filter="url(#shadow)"/>
    <rect x="20" y="61" width="40" height="30" rx="10"
          fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Body panel lines -->
    <line x1="28" y1="69" x2="36" y2="69" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="44" y1="69" x2="52" y2="69" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Centre status light -->
    <circle cx="40" cy="79" r="5.5" fill="#0b1736" stroke="#2563eb" stroke-width="1.2"/>
    <circle cx="40" cy="79" r="3" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="fill"
        values="#3b82f6;#60a5fa;#93c5fd;#60a5fa;#3b82f6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- ── Left arm (waves) ── -->
    <rect x="4" y="65" width="16" height="9" rx="4.5" fill="#1e40af" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate"
        values="0 12 69.5; -20 12 69.5; 10 12 69.5; 0 12 69.5"
        dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <!-- ── Right arm (steady) ── -->
    <rect x="60" y="65" width="16" height="9" rx="4.5" fill="#1e40af" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5"/>

    <!-- ── Legs ── -->
    <rect x="27" y="91" width="12" height="5" rx="2.5" fill="#172554" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="41" y="91" width="12" height="5" rx="2.5" fill="#172554" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>
