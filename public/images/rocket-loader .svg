<svg viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Streak gradient: head (left, opaque) → tail (right, transparent) -->
    <linearGradient id="sg" x1="0%" x2="100%">
      <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>

    <!-- Rocket body gradient -->
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Exhaust flame gradient -->
    <linearGradient id="fg" x1="0%" x2="100%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Glow filter for bright stars / flame -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->


  <!-- ── Ambient star dots ── -->
  <circle cx="80"  cy="30"  r="1.2" fill="#bfdbfe" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="18"  r="0.9" fill="#bfdbfe" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5"  dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="24"  r="1.4" fill="#bfdbfe" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7"  dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="38"  r="1.0" fill="#bfdbfe" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.1;0.55" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="14"  r="1.3" fill="#bfdbfe" opacity="0.65">
    <animate attributeName="opacity" values="0.65;0.1;0.65" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="155" r="1.1" fill="#bfdbfe" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="4.0s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="162" r="0.8" fill="#bfdbfe" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5"  dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Star streaks (right → left, giving speed illusion) ── -->
  <rect x="0" y="16.2" width="52" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.88s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="32.4" width="76" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.72s" begin="0.18s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="48.6" width="36" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.96s" begin="0.38s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="64.8" width="62" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.8s" begin="0.07s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="81.0" width="44" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.68s" begin="0.28s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="97.2" width="70" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.91s" begin="0.48s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="113.4" width="38" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.76s" begin="0.14s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="129.6" width="56" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.84s" begin="0.34s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="145.8" width="64" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.7s" begin="0.22s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="162.0" width="32" height="1.5" rx="0.75" fill="url(#sg)">
    <animateTransform attributeName="transform" type="translate"
      from="850 0" to="-320 0" dur="0.93s" begin="0.42s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Rocket (left → right sweep, with vertical wobble) ── -->
  <!--    Local coords: rocket body 24..74 x, 8..32 y; overall 0..96 x, 0..44 y  -->
  <g>
    <!-- Horizontal sweep -->
    <animateTransform attributeName="transform" type="translate"
      values="-110,68; 910,68" dur="2.6s" repeatCount="indefinite" calcMode="linear"/>
    <!-- Vertical wobble (additive) -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,3; 0,-4; 0,0" dur="1.3s" repeatCount="indefinite"
      additive="sum" calcMode="spline"
      keySplines="0.4,0,0.6,1; 0.4,0,0.6,1; 0.4,0,0.6,1; 0.4,0,0.6,1"
      keyTimes="0;0.25;0.5;0.75;1"/>

    <!-- Exhaust flame -->
    <ellipse cx="14" cy="22" rx="16" ry="8" fill="url(#fg)" filter="url(#glow)">
      <animate attributeName="rx" values="16;21;12;18;16" dur="0.22s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="8;5;9;4;8"     dur="0.22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="0.22s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Exhaust inner core (brighter) -->
    <ellipse cx="18" cy="22" rx="7" ry="4" fill="#fef08a" opacity="0.7">
      <animate attributeName="rx" values="7;10;5;8;7" dur="0.22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="0.22s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Top fin -->
    <polygon points="28,22 17,7  30,7"  fill="#1e40af"/>
    <!-- Bottom fin -->
    <polygon points="28,22 17,37 30,37" fill="#1e40af"/>

    <!-- Body -->
    <rect x="26" y="10" width="50" height="24" rx="5"
          fill="url(#rg)" stroke="#60a5fa" stroke-width="1.2"/>

    <!-- Nose cone -->
    <path d="M76 10 Q94 22 76 34 Z" fill="#2563eb" stroke="#60a5fa" stroke-width="1.2"/>

    <!-- Porthole -->
    <circle cx="46" cy="22" r="7" fill="#0b1736" stroke="#93c5fd" stroke-width="1.5"/>
    <ellipse cx="44" cy="20" rx="2.5" ry="2.5" fill="#bfdbfe" opacity="0.75"/>

    <!-- Body accent stripe -->
    <line x1="62" y1="13" x2="62" y2="31"
          stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.45"/>
  </g>

  <!-- ── "Searching through the cosmos" text + bouncing dots ── -->
  <text x="392" y="154" text-anchor="end"
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="500" letter-spacing="0.4"
        fill="#93c5fd" fill-opacity="0.72">
    Searching through the cosmos
  </text>

  <!-- Dot 1 -->
  <circle cx="400" cy="149" r="2.4" fill="#93c5fd" fill-opacity="0.72">
    <animate attributeName="opacity" values="0.2;1;0.2"  dur="1.05s" begin="0s"    repeatCount="indefinite"/>
    <animate attributeName="cy"      values="149;144;149" dur="1.05s" begin="0s"    repeatCount="indefinite"/>
  </circle>
  <!-- Dot 2 -->
  <circle cx="409" cy="149" r="2.4" fill="#93c5fd" fill-opacity="0.72">
    <animate attributeName="opacity" values="0.2;1;0.2"  dur="1.05s" begin="0.35s" repeatCount="indefinite"/>
    <animate attributeName="cy"      values="149;144;149" dur="1.05s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <!-- Dot 3 -->
  <circle cx="418" cy="149" r="2.4" fill="#93c5fd" fill-opacity="0.72">
    <animate attributeName="opacity" values="0.2;1;0.2"  dur="1.05s" begin="0.70s" repeatCount="indefinite"/>
    <animate attributeName="cy"      values="149;144;149" dur="1.05s" begin="0.70s" repeatCount="indefinite"/>
  </circle>
</svg>